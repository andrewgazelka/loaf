    <rect x="50" y="35" width="5" height="5" fill="#A47A2B"/>
  </g>

  <!-- Fork paths -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- Main stem -->
    <path d="M120 100 L155 100" stroke="#8b949e"/>

    <!-- Upper fork (accept path) -->
    <path class="fork-path" d="M155 100 C185 100, 195 65, 225 65" stroke="#22c55e"/>

    <!-- Lower fork (reject path) -->
    <path class="fork-path" d="M155 100 C185 100, 195 135, 225 135" stroke="#ef4444" style="animation-delay: 0.3s;"/>
  </g>

  <!-- Flowing particles on accept path -->
  <circle class="particle" r="4" fill="#22c55e" style="offset-path: path('M155 100 C185 100, 195 65, 225 65');"/>
  <circle class="particle" r="4" fill="#22c55e" style="offset-path: path('M155 100 C185 100, 195 65, 225 65'); animation-delay: 0.6s;"/>
  <circle class="particle" r="4" fill="#22c55e" style="offset-path: path('M155 100 C185 100, 195 65, 225 65'); animation-delay: 1.2s;"/>

  <!-- Flowing particles on reject path -->
  <circle class="particle" r="4" fill="#ef4444" style="offset-path: path('M155 100 C185 100, 195 135, 225 135'); animation-delay: 0.3s;"/>
  <circle class="particle" r="4" fill="#ef4444" style="offset-path: path('M155 100 C185 100, 195 135, 225 135'); animation-delay: 0.9s;"/>

  <!-- Accept icon -->
  <g class="accept-icon" transform="translate(230, 48)">
    <circle cx="17" cy="17" r="18" fill="#22c55e"/>
    <path d="M9 17 L15 23 L25 11" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Reject icon -->
  <g class="reject-icon" transform="translate(230, 118)">
    <circle cx="17" cy="17" r="18" fill="#ef4444"/>
    <path d="M11 11 L23 23 M23 11 L11 23" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text class="title" x="300" y="95" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">loaf</text>

  <!-- Subtitle -->
  <text class="subtitle" x="300" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Fork your filesystem. Accept or reject.</text>
</svg>
