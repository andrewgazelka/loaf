    <rect x="10" y="20" width="5" height="5" fill="#F4CA7B"/>
    <rect x="15" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="20" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="25" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="30" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="35" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="40" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="45" y="20" width="5" height="5" fill="#FFDEA0"/>
