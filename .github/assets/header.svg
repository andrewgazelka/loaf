    <rect x="50" y="30" width="5" height="5" fill="#D4AA5B"/>
    <rect x="55" y="30" width="5" height="5" fill="#B48A3B"/>

    <!-- Row 8: bottom -->
    <rect x="15" y="35" width="5" height="5" fill="#A47A2B"/>
    <rect x="20" y="35" width="5" height="5" fill="#B48A3B"/>
    <rect x="25" y="35" width="5" height="5" fill="#B48A3B"/>
