<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
  <style>
    @keyframes softPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    .accept-icon { animation: softPulse 2s ease-in-out infinite; }
    .reject-icon { animation: softPulse 2s ease-in-out infinite; animation-delay: 1s; }

    .title { fill: #1f2328; }
    .subtitle { fill: #656d76; }

    @media (prefers-color-scheme: dark) {
      .title { fill: #ffffff; }
      .subtitle { fill: #8b949e; }
    }
  </style>

  <!-- Fork diagram -->
  <line x1="50" y1="75" x2="120" y2="75" stroke="#8b949e" stroke-width="3"/>
  <path d="M120 75 Q150 75 175 45" fill="none" stroke="#22c55e" stroke-width="3"/>
  <path d="M120 75 Q150 75 175 105" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Accept icon -->
  <g class="accept-icon" transform="translate(175, 25)">
    <circle cx="18" cy="18" r="18" fill="#22c55e"/>
    <path d="M10 18 L16 24 L26 12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Reject icon -->
  <g class="reject-icon" transform="translate(175, 87)">
    <circle cx="18" cy="18" r="18" fill="#ef4444"/>
    <path d="M11 11 L25 25 M25 11 L11 25" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text class="title" x="230" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700">loaf</text>

  <!-- Subtitle -->
  <text class="subtitle" x="230" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16">Fork your filesystem. Accept or reject.</text>
</svg>
