<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <style>
    @keyframes breadFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes softPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    .bread { animation: breadFloat 3s ease-in-out infinite; }
    .accept-icon { animation: softPulse 2s ease-in-out infinite; }
    .reject-icon { animation: softPulse 2s ease-in-out infinite; animation-delay: 1s; }

    .title { fill: #1f2328; }
    .subtitle { fill: #656d76; }

    @media (prefers-color-scheme: dark) {
      .title { fill: #ffffff; }
      .subtitle { fill: #8b949e; }
    }
  </style>

  <!-- Minecraft Bread (pixel art) - scaled up 1.5x, vertically centered -->
  <g class="bread" transform="translate(90, 70) scale(1.5)">
    <!-- Row 1: top crust -->
    <rect x="15" y="0" width="5" height="5" fill="#C49A4B"/>
    <rect x="20" y="0" width="5" height="5" fill="#D4AA5B"/>
    <rect x="25" y="0" width="5" height="5" fill="#D4AA5B"/>
    <rect x="30" y="0" width="5" height="5" fill="#D4AA5B"/>
    <rect x="35" y="0" width="5" height="5" fill="#D4AA5B"/>
    <rect x="40" y="0" width="5" height="5" fill="#D4AA5B"/>
    <rect x="45" y="0" width="5" height="5" fill="#D4AA5B"/>
    <rect x="50" y="0" width="5" height="5" fill="#C49A4B"/>

    <!-- Row 2 -->
    <rect x="10" y="5" width="5" height="5" fill="#C49A4B"/>
    <rect x="15" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="20" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="25" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="30" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="35" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="40" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="45" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="50" y="5" width="5" height="5" fill="#E4BA6B"/>
    <rect x="55" y="5" width="5" height="5" fill="#C49A4B"/>

    <!-- Row 3 -->
    <rect x="5" y="10" width="5" height="5" fill="#C49A4B"/>
    <rect x="10" y="10" width="5" height="5" fill="#E4BA6B"/>
    <rect x="15" y="10" width="5" height="5" fill="#F4CA7B"/>
    <rect x="20" y="10" width="5" height="5" fill="#F4CA7B"/>
    <rect x="25" y="10" width="5" height="5" fill="#F4CA7B"/>
    <rect x="30" y="10" width="5" height="5" fill="#F4CA7B"/>
    <rect x="35" y="10" width="5" height="5" fill="#F4CA7B"/>
    <rect x="40" y="10" width="5" height="5" fill="#F4CA7B"/>
    <rect x="45" y="10" width="5" height="5" fill="#F4CA7B"/>
    <rect x="50" y="10" width="5" height="5" fill="#E4BA6B"/>
    <rect x="55" y="10" width="5" height="5" fill="#E4BA6B"/>
    <rect x="60" y="10" width="5" height="5" fill="#C49A4B"/>

    <!-- Row 4: main body -->
    <rect x="5" y="15" width="5" height="5" fill="#C49A4B"/>
    <rect x="10" y="15" width="5" height="5" fill="#F4CA7B"/>
    <rect x="15" y="15" width="5" height="5" fill="#FFDEA0"/>
    <rect x="20" y="15" width="5" height="5" fill="#FFDEA0"/>
    <rect x="25" y="15" width="5" height="5" fill="#FFDEA0"/>
    <rect x="30" y="15" width="5" height="5" fill="#FFDEA0"/>
    <rect x="35" y="15" width="5" height="5" fill="#FFDEA0"/>
    <rect x="40" y="15" width="5" height="5" fill="#FFDEA0"/>
    <rect x="45" y="15" width="5" height="5" fill="#FFDEA0"/>
    <rect x="50" y="15" width="5" height="5" fill="#F4CA7B"/>
    <rect x="55" y="15" width="5" height="5" fill="#E4BA6B"/>
    <rect x="60" y="15" width="5" height="5" fill="#C49A4B"/>

    <!-- Row 5 -->
    <rect x="5" y="20" width="5" height="5" fill="#C49A4B"/>
    <rect x="10" y="20" width="5" height="5" fill="#F4CA7B"/>
    <rect x="15" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="20" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="25" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="30" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="35" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="40" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="45" y="20" width="5" height="5" fill="#FFDEA0"/>
    <rect x="50" y="20" width="5" height="5" fill="#F4CA7B"/>
    <rect x="55" y="20" width="5" height="5" fill="#E4BA6B"/>
    <rect x="60" y="20" width="5" height="5" fill="#C49A4B"/>

    <!-- Row 6 -->
    <rect x="5" y="25" width="5" height="5" fill="#B48A3B"/>
    <rect x="10" y="25" width="5" height="5" fill="#E4BA6B"/>
    <rect x="15" y="25" width="5" height="5" fill="#F4CA7B"/>
    <rect x="20" y="25" width="5" height="5" fill="#F4CA7B"/>
    <rect x="25" y="25" width="5" height="5" fill="#F4CA7B"/>
    <rect x="30" y="25" width="5" height="5" fill="#F4CA7B"/>
    <rect x="35" y="25" width="5" height="5" fill="#F4CA7B"/>
    <rect x="40" y="25" width="5" height="5" fill="#F4CA7B"/>
    <rect x="45" y="25" width="5" height="5" fill="#F4CA7B"/>
    <rect x="50" y="25" width="5" height="5" fill="#E4BA6B"/>
    <rect x="55" y="25" width="5" height="5" fill="#D4AA5B"/>
    <rect x="60" y="25" width="5" height="5" fill="#B48A3B"/>

    <!-- Row 7 -->
    <rect x="10" y="30" width="5" height="5" fill="#B48A3B"/>
    <rect x="15" y="30" width="5" height="5" fill="#D4AA5B"/>
    <rect x="20" y="30" width="5" height="5" fill="#E4BA6B"/>
    <rect x="25" y="30" width="5" height="5" fill="#E4BA6B"/>
    <rect x="30" y="30" width="5" height="5" fill="#E4BA6B"/>
    <rect x="35" y="30" width="5" height="5" fill="#E4BA6B"/>
    <rect x="40" y="30" width="5" height="5" fill="#E4BA6B"/>
    <rect x="45" y="30" width="5" height="5" fill="#D4AA5B"/>
    <rect x="50" y="30" width="5" height="5" fill="#D4AA5B"/>
    <rect x="55" y="30" width="5" height="5" fill="#B48A3B"/>

    <!-- Row 8: bottom -->
    <rect x="15" y="35" width="5" height="5" fill="#A47A2B"/>
    <rect x="20" y="35" width="5" height="5" fill="#B48A3B"/>
    <rect x="25" y="35" width="5" height="5" fill="#B48A3B"/>
    <rect x="30" y="35" width="5" height="5" fill="#B48A3B"/>
    <rect x="35" y="35" width="5" height="5" fill="#B48A3B"/>
    <rect x="40" y="35" width="5" height="5" fill="#B48A3B"/>
    <rect x="45" y="35" width="5" height="5" fill="#B48A3B"/>
    <rect x="50" y="35" width="5" height="5" fill="#A47A2B"/>
  </g>

  <!-- Arrow from bread to fork -->
  <line x1="190" y1="100" x2="250" y2="100" stroke="#8b949e" stroke-width="2.5"/>

  <!-- Fork to accept -->
  <path d="M250 100 Q280 100 305 70" fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Fork to reject -->
  <path d="M250 100 Q280 100 305 130" fill="none" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Accept icon -->
  <g class="accept-icon" transform="translate(305, 45)">
    <circle cx="18" cy="18" r="18" fill="#22c55e"/>
    <path d="M10 18 L16 24 L26 12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Reject icon -->
  <g class="reject-icon" transform="translate(305, 115)">
    <circle cx="18" cy="18" r="18" fill="#ef4444"/>
    <path d="M11 11 L25 25 M25 11 L11 25" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text class="title" x="370" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700">loaf</text>

  <!-- Subtitle -->
  <text class="subtitle" x="370" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="18">Fork your filesystem. Accept or reject.</text>
</svg>
